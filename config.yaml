# HFSS 自动化仿真配置文件
# 请根据您的实际环境修改以下各项参数

# ============================================================
# HFSS 安装配置
# ============================================================
hfss:
  # HFSS 版本号（格式：YYYY.R，如 2023.1 代表 2023R1）
  version: "2023.1"

  # HFSS 安装根目录（示例为默认安装路径，请根据实际修改）
  # Windows 示例: "C:/Program Files/AnsysEM/v231/Win64"
  install_dir: "C:/Program Files/AnsysEM/v231/Win64"

  # 是否以非图形模式运行（True = 无界面，推荐生产环境使用）
  non_graphical: true

  # 每次仿真启动新的 HFSS 进程，而非复用（推荐 true，防止内存泄漏）
  new_session: true

# ============================================================
# 模板工程文件配置
# ============================================================
project:
  # .aedt 模板文件路径（相对于项目根目录，或绝对路径）
  template_path: "templates/antenna_template.aedt"

  # HFSS 设计名称（模板工程中的设计名，区分大小写）
  design_name: "HFSSDesign1"

  # 求解类型："Modal"（模式驱动）或 "Terminal"（终端驱动）
  solution_type: "Modal"

  # 激励端口名称（必须与 HFSS 中的端口名完全一致，区分大小写）
  port_name: "Port1"

# ============================================================
# 参数化变量配置
# ============================================================
# 注意：变量名必须与 HFSS 模型中的变量名完全一致，包括大小写！
# 例如 HFSS 中是 "Length" 则这里必须填 "Length"，而不能填 "length"
variables:
  # 参数名列表，顺序与 run_hfss_simulation(x) 中 x 数组的顺序一一对应
  names:
    - "Length"     # x[0]: 贴片长度
    - "Width"      # x[1]: 贴片宽度
    - "Feed_X"     # x[2]: 馈电点 X 坐标

  # 对应的单位（与名称列表一一对应）
  units:
    - "mm"
    - "mm"
    - "mm"

# ============================================================
# 频段设置
# ============================================================
frequency:
  # 起始频率（GHz）
  start: 2.0

  # 终止频率（GHz）
  stop: 3.0

  # 扫频点数（不是步长，是总的频率采样点数量）
  num_points: 101

  # 频率单位（目前固定为 GHz，供后续扩展参考）
  unit: "GHz"

# ============================================================
# 仿真精度配置
# ============================================================
fidelity:
  # 粗网格仿真参数（快速预览，适用于优化搜索阶段）
  coarse:
    # 最大自适应网格迭代次数（越小越快，精度越低）
    max_passes: 5
    # 收敛精度阈值 ΔS（越大越快，精度越低）
    max_delta_s: 0.05
    # 频率扫描类型："Interpolating"（插值，快）或 "Discrete"（离散，慢但精确）
    sweep_type: "Interpolating"

  # 细网格仿真参数（精确计算，适用于最终验证阶段）
  fine:
    # 最大自适应网格迭代次数
    max_passes: 15
    # 收敛精度阈值 ΔS
    max_delta_s: 0.01
    # 频率扫描类型
    sweep_type: "Interpolating"

# ============================================================
# 稳定性和容错配置
# ============================================================
stability:
  # 单次仿真超时时间（秒）。超时后自动强制终止 HFSS 进程
  timeout_seconds: 600

  # 单次仿真失败后的最大重试次数
  max_retries: 3

  # 重试前等待时间（秒）
  retry_delay_seconds: 10

# ============================================================
# 输出配置
# ============================================================
output:
  # 结果保存目录
  results_dir: "results"

  # 是否保存每次仿真结果到 JSON 文件（用于断点续跑）
  save_results: true

  # 结果文件名前缀
  results_prefix: "simulation"

# ============================================================
# 日志配置
# ============================================================
logging:
  # 日志保存目录
  log_dir: "logs"

  # 日志级别："DEBUG" / "INFO" / "WARNING" / "ERROR"
  level: "INFO"

  # 日志文件名前缀
  log_prefix: "hfss_simulation"

  # 是否同时在控制台打印日志
  console_output: true
