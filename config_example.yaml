# ============================================================
# HFSS 自动化仿真配置文件 - 示例模板
# ============================================================
# 这是一个带有详细注释的配置模板。
# 使用时，将此文件复制为 config.yaml 并按实际情况修改。
#
# 【重要提示】
# 1. 变量名必须与 HFSS 模型中完全一致，包括大小写！
# 2. HFSS 版本号格式：2023R1 对应 "2023.1"，2024R2 对应 "2024.2"
# 3. 模板文件路径支持相对路径（相对于项目根目录）或绝对路径
# ============================================================

# ============================================================
# HFSS 安装配置
# ============================================================
hfss:
  # HFSS 版本号
  # 格式说明：
  #   2023R1 → "2023.1"
  #   2023R2 → "2023.2"
  #   2024R1 → "2024.1"
  version: "2023.1"

  # HFSS 安装根目录（包含 ansysedt.exe 的目录）
  # 默认安装路径示例：
  #   v231 (2023R1): "C:/Program Files/AnsysEM/v231/Win64"
  #   v232 (2023R2): "C:/Program Files/AnsysEM/v232/Win64"
  #   v241 (2024R1): "C:/Program Files/AnsysEM/v241/Win64"
  install_dir: "C:/Program Files/AnsysEM/v231/Win64"

  # 非图形模式（推荐保持 true，可以避免所有弹窗）
  # true  = 无界面运行，适合服务器和批量仿真
  # false = 有界面运行，适合调试和开发
  non_graphical: true

  # 每次仿真是否启动新进程
  # true  = 每次新建 HFSS 进程（推荐，防止内存累积）
  # false = 复用已有进程（速度稍快，但可能内存泄漏）
  new_session: true

# ============================================================
# 模板工程文件配置
# ============================================================
project:
  # .aedt 模板工程文件路径
  # 示例（相对路径）: "templates/my_antenna.aedt"
  # 示例（绝对路径）: "D:/HFSS_Projects/my_antenna.aedt"
  template_path: "templates/antenna_template.aedt"

  # HFSS 设计名称
  # 打开 HFSS → Project Manager → 展开项目 → 查看设计名称
  # 注意：区分大小写
  design_name: "HFSSDesign1"

  # 求解类型
  # "Modal"    = 模式驱动（最常用，适合天线、波导等）
  # "Terminal" = 终端驱动（适合有多个物理导体端口的结构）
  solution_type: "Modal"

  # S 参数端口名称
  # 在 HFSS 中查看：展开设计 → Excitations → 查看端口名
  # 常见默认值："Port1"、"1"、"p1"
  # 注意：区分大小写
  port_name: "Port1"

# ============================================================
# 参数化变量配置
# ============================================================
# 【关键配置】此处变量名必须与 HFSS 模型中的变量名完全一致！
#
# 查看方法：在 HFSS 中打开模板工程 → 菜单 → HFSS → Design Properties
# 可以看到所有参数化变量的名称，将其原封不动填入 names 列表
#
# names 列表的顺序 = run_hfss_simulation(x) 中 x 数组的下标顺序
# 例如：x[0] 对应 names[0]，x[1] 对应 names[1]，以此类推
variables:
  names:
    - "Length"     # x[0]: 贴片长度（示例，请替换为实际变量名）
    - "Width"      # x[1]: 贴片宽度（示例，请替换为实际变量名）
    - "Feed_X"     # x[2]: 馈电点 X 坐标（示例，请替换为实际变量名）
    # 如有更多变量，继续添加：
    # - "Feed_Y"   # x[3]: 馈电点 Y 坐标
    # - "Sub_H"    # x[4]: 基板厚度

  # 变量单位（与 names 列表一一对应）
  # 常见单位："mm"（毫米）、"um"（微米）、"m"（米）、"deg"（角度）
  units:
    - "mm"
    - "mm"
    - "mm"
    # 新增变量时同步添加对应单位：
    # - "mm"
    # - "mm"

# ============================================================
# 频段设置
# ============================================================
frequency:
  # 起始频率（单位：GHz）
  # 示例：2.4 GHz WiFi → start: 2.4
  start: 2.0

  # 终止频率（单位：GHz）
  stop: 3.0

  # 频率扫描点总数
  # 建议值：
  #   粗扫（快速预览）: 51
  #   细扫（高精度）  : 201
  # 注意：此处设置的是全局默认值，具体精度参数在 fidelity 中设置
  num_points: 101

  # 频率单位（目前固定为 GHz）
  unit: "GHz"

# ============================================================
# 仿真精度配置
# ============================================================
fidelity:
  # 粗网格（coarse）：速度快，精度低
  # 适用场景：优化算法的搜索阶段、快速参数扫描
  coarse:
    # 自适应网格迭代上限
    # 建议值：3~6（越小越快）
    max_passes: 5

    # S 参数收敛判据 ΔS（两次迭代之间 S 矩阵的最大变化量）
    # 建议值：0.02~0.05（越大越快）
    max_delta_s: 0.05

    # 频率扫描方式
    # "Interpolating" = 插值扫描（快，精度稍低）
    # "Discrete"      = 离散扫描（精确，但慢）
    sweep_type: "Interpolating"

  # 细网格（fine）：速度慢，精度高
  # 适用场景：最终结果验证、论文数据生成
  fine:
    # 自适应网格迭代上限
    # 建议值：10~20
    max_passes: 15

    # S 参数收敛判据 ΔS
    # 建议值：0.005~0.02
    max_delta_s: 0.01

    # 频率扫描方式
    sweep_type: "Interpolating"

# ============================================================
# 稳定性和容错配置
# ============================================================
stability:
  # 单次仿真超时时间（秒）
  # 超时后自动强制终止 HFSS 进程，防止卡死
  # 建议值：
  #   coarse 模式：300~600 秒（5~10 分钟）
  #   fine 模式  ：1800~3600 秒（30~60 分钟）
  # 此处设置的是最长等待时间上限
  timeout_seconds: 600

  # 单次仿真失败时的最大重试次数
  # 设置为 0 表示失败不重试，直接跳过
  max_retries: 3

  # 重试前的等待时间（秒）
  # 给 HFSS 进程足够的时间完全退出
  retry_delay_seconds: 10

# ============================================================
# 输出配置
# ============================================================
output:
  # 仿真结果保存目录（相对路径或绝对路径）
  results_dir: "results"

  # 是否保存每次仿真结果（用于断点续跑）
  # true  = 每次仿真后立即写入 JSON 文件
  # false = 只在内存中保留，不写文件
  save_results: true

  # 结果文件名前缀（实际文件名 = 前缀 + 序号 + .json）
  results_prefix: "simulation"

# ============================================================
# 日志配置
# ============================================================
logging:
  # 日志文件保存目录
  log_dir: "logs"

  # 日志详细程度
  # "DEBUG"   = 最详细，显示所有调试信息（仅开发调试时使用）
  # "INFO"    = 常规信息，显示仿真进度（推荐日常使用）
  # "WARNING" = 只显示警告和错误
  # "ERROR"   = 只显示错误
  level: "INFO"

  # 日志文件名前缀（实际文件名 = 前缀 + 日期时间 + .log）
  log_prefix: "hfss_simulation"

  # 是否同时在控制台（终端）输出日志
  # true  = 同时输出到文件和控制台
  # false = 只输出到文件
  console_output: true
